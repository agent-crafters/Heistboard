<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Southbank District fictional sample map</title>
  <desc id="desc">An original stylized map with streets, blocks, a canal, a park, and fictional place labels.</desc>
  <defs>
    <pattern id="paper" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#dcd4bf"/>
      <path d="M0 8h32M7 0v32" stroke="#746f64" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="park-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#a9b69c"/>
      <circle cx="7" cy="8" r="2" fill="#61765f" opacity=".38"/>
      <circle cx="22" cy="20" r="2.5" fill="#61765f" opacity=".28"/>
    </pattern>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .045"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
